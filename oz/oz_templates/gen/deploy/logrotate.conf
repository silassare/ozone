# Rotates the logs of __PROJECT__, generated by `oz deploy init`.
#
# Install as /etc/logrotate.d/__NAME__.
#
# OZone rotates its own `ozone.{scope}.log` by size (OZ_LOG_MAX_FILE_SIZE / OZ_LOG_MAX_FILES in
# oz.logs); this covers what it does not: the rotated files it keeps, and the PHP-FPM logs.

__LOGS_DIR__/*.log {
	daily
	rotate 14
	missingok
	notifempty
	compress
	delaycompress
	# OZone appends and reopens, so there is no process to signal.
	copytruncate
	su __USER__ __GROUP__
}
