# CI for __PROJECT__, generated by `oz deploy init`.
#
# It checks the project, then deploys on a push to the default branch. Set these repository secrets:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY (a private key), and DEPLOY_PATH (the deploy root).

name: ci

on:
  push:
    branches: [__BRANCH__]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '__PHP_VERSION__'
          extensions: __PHP_EXTENSIONS__
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check this machine and the project
        run: php vendor/bin/oz doctor check --json

      - name: Tests
        run: vendor/bin/phpunit

  deploy:
    needs: check
    if: github.ref == 'refs/heads/__BRANCH__' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deploy at a time: two releases swapping the `current` symlink at once is how a half
    # migrated database happens.
    concurrency: deploy-__BRANCH__

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}/current
            php vendor/bin/oz deploy run --ref=${{ github.sha }}
