; PHP-FPM pool for the "__SCOPE__" scope of __PROJECT__, generated by `oz deploy init`.
;
; Install it as /etc/php/__PHP_VERSION__/fpm/pool.d/__POOL_NAME__.conf, then
; `systemctl reload php__PHP_VERSION__-fpm`.

[__POOL_NAME__]

user = __USER__
group = __GROUP__

listen = /run/php/__POOL_NAME__.sock
listen.owner = __WEB_USER__
listen.group = __WEB_GROUP__
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; The scope this pool serves. OZone reads it to pick the scope's settings and directories.
env[OZ_SCOPE_NAME] = __SCOPE__

php_admin_value[error_log] = __LOGS_DIR__/php-fpm.__SCOPE__.log
php_admin_flag[log_errors] = on
php_admin_value[upload_max_filesize] = __MAX_BODY_SIZE__
php_admin_value[post_max_size] = __MAX_BODY_SIZE__

; Never expose the PHP version, and never let a request escape the project.
php_admin_value[expose_php] = off
php_admin_value[open_basedir] = __PROJECT_DIR__:/tmp:/usr/share/php
