# nginx for the "__SCOPE__" scope of __PROJECT__, generated by `oz deploy init`.
#
# Install it as /etc/nginx/sites-available/__SERVER_NAME__, symlink it into sites-enabled, then
# `nginx -t && systemctl reload nginx`. Run `certbot --nginx -d __SERVER_NAME__` for TLS: it rewrites
# the listen directives below.

server {
	listen 80;
	listen [::]:80;

	server_name __SERVER_NAME__;
	server_tokens off;

	# The scope's document root. It holds index.php and a `static` symlink into data/static/__SCOPE__;
	# `oz project link` creates that link, and it is not version-controlled.
	root __DOCUMENT_ROOT__;
	index index.php;

	charset utf-8;
	client_max_body_size __MAX_BODY_SIZE__;

	access_log /var/log/nginx/__SERVER_NAME__.access.log;
	error_log  /var/log/nginx/__SERVER_NAME__.error.log;

	location = /favicon.ico { access_log off; log_not_found off; }
	location = /robots.txt  { access_log off; log_not_found off; }

	# Public files, through the symlink. OZone serves private files itself, after an access check.
	location /static/ {
		# The link points outside the document root, so nginx has to be told to follow it.
		disable_symlinks off;
		add_header Cache-Control "public, max-age=2592000";
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location ~ \.php$ {
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
		fastcgi_param DOCUMENT_ROOT $realpath_root;
		fastcgi_pass unix:/run/php/__POOL_NAME__.sock;
		fastcgi_index index.php;
		fastcgi_hide_header X-Powered-By;
	}

	# Nothing but the entry point is served: the sources, the state and the caches all live outside
	# this directory, and a dotfile has no business being reachable.
	location ~ /\. {
		deny all;
	}
}
