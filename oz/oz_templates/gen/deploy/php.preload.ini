; OPcache preloading for __PROJECT__, generated by `oz deploy init`.
;
; Install it as /etc/php/__PHP_VERSION__/fpm/conf.d/99-__NAME__-preload.ini, then
; `systemctl restart php__PHP_VERSION__-fpm`. To stop preloading, remove it and restart PHP-FPM.
;
; PHP-FPM reads it once, when it starts, for all of its pools: one project per PHP-FPM server can
; preload. The script is written by `oz project build`, which `oz deploy run` runs for each release,
; and preloads the release `current` points to when PHP-FPM starts. Preloaded code only changes when
; PHP-FPM restarts: deploy with `oz deploy run --restart=php__PHP_VERSION__-fpm`.

opcache.preload = __PRELOAD_FILE__

; PHP-FPM starts as root, and preloads as this user: the one its pools run as.
opcache.preload_user = __USER__
