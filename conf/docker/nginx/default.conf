# nginx in front of the `app` (PHP-FPM) container, serving the `api` scope.
# Adapted from conf/nginx/api.example.com; for another scope, change `root` (public/<scope>).

server {
	listen 80;
	listen [::]:80;

	server_tokens off;
	server_name _;

	root /var/www/html/public/api;
	index index.php;

	# Keep above OZ_UPLOAD_FILE_MAX_TOTAL_SIZE (oz.files).
	client_max_body_size 110m;

	add_header X-Frame-Options "SAMEORIGIN";
	add_header X-Content-Type-Options "nosniff";

	fastcgi_buffers 16 16k;
	fastcgi_buffer_size 32k;
	fastcgi_busy_buffers_size 64k;
	fastcgi_temp_file_write_size 64k;

	# disable access to ozone log files
	location ~ /ozone[^/]*\.log$ {
		deny all;
		return 403;
	}

	# disable access to hidden files, except .well-known used by Let's Encrypt
	location ~ /\.(?!well-known) {
		deny all;
		return 403;
	}

	location = /robots.txt {
		try_files $uri =404;
		access_log off;
		log_not_found off;
	}

	location = /favicon.ico {
		try_files $uri =404;
		access_log off;
		log_not_found off;
	}

	# existing files, else the OZone entry point
	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ [^/]\.php(/|$) {
		fastcgi_split_path_info ^(.+?\.php)(/.*)$;

		if (!-f $document_root$fastcgi_script_name) {
			return 404;
		}

		fastcgi_index index.php;

		include fastcgi_params;

		# Mitigate https://httpoxy.org/ vulnerabilities
		fastcgi_param HTTP_PROXY "";
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

		# the `app` service of docker/compose.yaml
		fastcgi_pass app:9000;
	}

	# With OZ_SERVER_SENDFILE_ENABLED (oz.files), PHP hands file downloads over to nginx
	# (X-Accel-Redirect). Mount the `data` volume in `web` (read-only) and uncomment:
	#
	# location /send-file/ {
	# 	internal;
	# 	alias /var/www/html/;
	# }
}
