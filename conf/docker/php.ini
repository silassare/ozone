; Production settings of an OZone project image.

expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
date.timezone = UTC

memory_limit = 256M
; Keep above OZ_UPLOAD_FILE_MAX_SIZE / OZ_UPLOAD_FILE_MAX_TOTAL_SIZE (oz.files).
upload_max_filesize = 20M
post_max_size = 110M

; The code does not change in a running image.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; PHP's own upload-progress tracking is never read: OZone handles uploads itself. It is on by
; default and runs on every multipart POST, session or not, so it is work no request asks for and
; state no code reads. Keep it off.
session.upload_progress.enabled = 0
