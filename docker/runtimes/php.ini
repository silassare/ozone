; PHP settings of the worker servers (docker/runtimes/Dockerfile).
;
; Errors are logged, never displayed: under RoadRunner the worker's output is the protocol pipe, and
; a displayed warning would corrupt it; under FrankenPHP and Swoole it would land in a response. The
; CLI logs to stderr, FrankenPHP to its server log.
display_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 512M
date.timezone = UTC

; PHP's own upload-progress tracking is never read: OZone handles uploads itself. It is on by
; default and runs on every multipart POST, session or not, so it is work no request asks for and
; state no code reads. Keep it off.
session.upload_progress.enabled = 0
