; The same PHP settings for every application `make benchmark-http` measures: production OPcache
; (no timestamp checks), errors logged and never displayed.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
display_errors = Off
log_errors = On
memory_limit = 512M
date.timezone = UTC
